<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⏱️ Arbeidstijden Tracker v2.6-G</title>
<style>
:root {
--bg-color: #121824;
--card-color: #1e293b;
--text-color: #f8fafc;
--accent-bus: #eab308;
--accent-cbr: #3b82f6;
--accent-vracht: #ef4444;
--success: #22c55e;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background-color: var(--bg-color);
color: var(--text-color);
margin: 0;
padding: 15px;
display: flex;
flex-direction: column;
align-items: center;
}

.container {
width: 100%;
max-width: 500px;
}

h1 {
text-align: center;
font-size: 1.5rem;
text-transform: uppercase;
letter-spacing: 1px;
color: var(--accent-bus);
margin-bottom: 5px;
}

.version {
text-align: center;
font-size: 0.8rem;
opacity: 0.6;
margin-bottom: 20px;
font-weight: bold;
color: #a78bfa;
}

/* STAP 1: Discipline Knoppen helemaal bovenaan */
.discipline-selector {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
margin-bottom: 20px;
}

.btn-discipline {
background-color: var(--card-color);
border: 2px solid transparent;
color: var(--text-color);
padding: 12px 5px;
border-radius: 8px;
font-weight: bold;
cursor: pointer;
transition: all 0.2s;
font-size: 0.9rem;
}

.btn-discipline.active[data-type="bus"] { border-color: var(--accent-bus); background-color: rgba(234, 179, 8, 0.1); }
.btn-discipline.active[data-type="cbr"] { border-color: var(--accent-cbr); background-color: rgba(59, 130, 246, 0.1); }
.btn-discipline.active[data-type="vracht"] { border-color: var(--accent-vracht); background-color: rgba(239, 68, 68, 0.1); }

/* STAP 2: Datum & Invoerblok */
.card {
background-color: var(--card-color);
border-radius: 12px;
padding: 15px;
margin-bottom: 20px;
box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
}

label {
display: block;
font-size: 0.8rem;
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 5px;
opacity: 0.8;
}

input, select {
width: 100%;
padding: 10px;
background-color: var(--bg-color);
border: 1px solid #334155;
border-radius: 6px;
color: var(--text-color);
font-size: 1rem;
box-sizing: border-box;
margin-bottom: 15px;
}

.invoer-paneel {
display: none;
}

.invoer-paneel.active {
display: block;
}

.btn-action {
width: 100%;
background-color: #06b6d4;
color: #fff;
border: none;
padding: 12px;
border-radius: 6px;
font-weight: bold;
font-size: 1rem;
cursor: pointer;
}

/* STAP 3: Totalen & Dashboard */
.grid-2 {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 10px;
}

.stat-box {
background-color: rgba(255,255,255,0.03);
border: 1px solid #334155;
border-radius: 8px;
padding: 10px;
text-align: center;
}

.stat-val {
font-size: 1.2rem;
font-weight: bold;
margin-top: 5px;
}

.text-green { color: var(--success); }
.text-yellow { color: var(--accent-bus); }

.alert-box {
background-color: rgba(34, 197, 94, 0.1);
border: 1px solid var(--success);
color: var(--success);
padding: 10px;
border-radius: 6px;
text-align: center;
font-size: 0.9rem;
margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">
<h1>⏱️ Arbeidstijden Tracker</h1>
<div class="version">Versie 2.6-G</div>

<!-- STAP 1: Discipline Knoppen helemaal bovenaan -->
<div class="discipline-selector">
<button class="btn-discipline active" data-type="bus" onclick="switchDiscipline('bus')">🚌 Bus</button>
<button class="btn-discipline" data-type="cbr" onclick="switchDiscipline('cbr')">💼 CBR</button>
<button class="btn-discipline" data-type="vracht" onclick="switchDiscipline('vracht')">🚛 Vracht</button>
</div>

<!-- STAP 2: Datum & Dynamische Invoer -->
<div class="card">
<label for="datum">Selecteer Datum</label>
<input type="date" id="datum">

<!-- BUS PANEEL -->
<div id="paneel-bus" class="invoer-paneel active">
<label for="dienstnummer">Dienstnummer (EBS)</label>
<input type="text" id="dienstnummer" placeholder="Bijv. 4717">
<button class="btn-action" onclick="laadBusDienst()">🚌 Dienst Inladen</button>
</div>

<!-- CBR PANEEL -->
<div id="paneel-cbr" class="invoer-paneel">
<button class="btn-action" style="background-color: var(--accent-cbr);" onclick="laadCbrStandaard()">💼 Standaard CBR-dag Inladen</button>
</div>

<!-- VRACHTAUTO PANEEL -->
<div id="paneel-vracht" class="invoer-paneel">
<div class="grid-2">
<div>
<label>Start Rijtijd</label>
<input type="time" id="vracht-rij-start">
</div>
<div>
<label>Eind Rijtijd</label>
<input type="time" id="vracht-rij-eind">
</div>
</div>
<button class="btn-action" style="background-color: var(--accent-vracht);" onclick="voegVrachtUrenToe()">🚛 Vrachturen Opslaan</button>
</div>
</div>

<!-- STAP 3: De Totalen & Wettelijke Tellers (Dashboard) -->
<div class="card">
<label>Dagsamenvatting Geselecteerde Dag</label>
<div class="grid-2">
<div class="stat-box">Diensturen<div class="stat-val" id="lbl-diensturen">00:00</div></div>
<div class="stat-box">Totale Pauze<div class="stat-val" id="lbl-pauze">00:00</div></div>
</div>
<div class="grid-2">
<div class="stat-box">Totale Rijtijd<div class="stat-val text-yellow" id="lbl-rijtijd">00:00</div></div>
<div class="stat-box">Totale Arbeid<div class="stat-val text-yellow" id="lbl-arbeid">00:00</div></div>
</div>

<label style="margin-top: 15px;">Wettelijk Resterend & Limieten</label>
<div class="grid-2">
<div class="stat-box">Resterende Rijtijd (Dag)<div class="stat-val text-green" id="lbl-rest-rijdag">9:00</div></div>
<div class="stat-box">Resterende Arbeid (Week)<div class="stat-val text-green" id="lbl-rest-arbweek">60:00</div></div>
</div>
<div class="grid-2">
<div class="stat-box">Gerealiseerde Nachtrust<div class="stat-val" id="lbl-nachtrust">--:--</div></div>
<div class="stat-box">Pauze status<div class="stat-val" id="lbl-pauze-status">OK</div></div>
</div>

<div id="wettelijke-melding" class="alert-box">
Systeem operationeel. Voer gegevens in om de wetgeving te toetsen.
</div>
</div>
</div>

<script>
// Database voor Busdiensten (Letters worden genegeerd bij het zoeken)
const dienstenDatabase = {
"4717": { start: "08:12", eind: "16:30", rijtijd: 345, arbeid: 45, pauze: 45 },
"4701": { start: "07:31", eind: "16:16", rijtijd: 360, arbeid: 60, pauze: 65 }
};

let logboekData = {};

// Zet datum standaard op vandaag
document.getElementById('datum').valueAsDate = new Date();

function switchDiscipline(type) {
document.querySelectorAll('.btn-discipline').forEach(btn => btn.classList.remove('active'));
document.querySelector(.btn-discipline[data-type="${type}"]`).classList.add('active');

document.querySelectorAll('.invoer-paneel').forEach(p => p.classList.remove('active'));
document.getElementById(paneel-${type}`).classList.add('active');
}

function laadBusDienst() {
const nr = document.getElementById('dienstnummer').value.trim();
const datum = document.getElementById('datum').value;

if (dienstenDatabase[nr]) {
const data = dienstenDatabase[nr];
slaDagOp(datum, 'bus', data.rijtijd, data.arbeid, data.pauze, data.start, data.eind);
updateDashboard(datum);
toonMelding(✅ Dienst ${nr} succesvol ingeladen voor ${datum}!);
} else {
alert("Dienstnummer niet gevonden in de database.");
}
}

function laadCbrStandaard() {
const datum = document.getElementById('datum').value;
slaDagOp(datum, 'cbr', 0, 480, 45, "08:00", "16:45");
updateDashboard(datum);
toonMelding(✅ Standaard CBR-dag opgeslagen voor ${datum}.`);
}

function voegVrachtUrenToe() {
const datum = document.getElementById('datum').value;
const start = document.getElementById('vracht-rij-start').value;
const eind = document.getElementById('vracht-rij-eind').value;

if(!start || !eind) {
alert("Vul uren in voor de vrachtwagen.");
return;
}

const [hStart, mStart] = start.split(':').map(Number);
const [hEind, mEind] = eind.split(':').map(Number);
const totaalMinuten = (hEind * 60 + mEind) - (hStart * 60 + mStart);

slaDagOp(datum, 'vracht', totaalMinuten, 0, 0, start, eind);
updateDashboard(datum);
toonMelding(✅ Vrachtwagen uren toegevoegd voor${datum}.`);
}

function slaDagOp(datum, discipline, rijtijd, arbeid, pauze, start, eind) {
if (!logboekData[datum]) {
logboekData[datum] = { bus: {}, cbr: {}, vracht: {}, start: start, eind: eind };
}

logboekData[datum][discipline] = { rijtijd, arbeid, pauze };
if(start < logboekData[datum].start) logboekData[datum].start = start;
if(eind > logboekData[datum].eind) logboekData[datum].eind = eind;
}

function updateDashboard(datum) {
const dag = logboekData[datum];
if (!dag) return;

let totaleRijtijd = (dag.bus.rijtijd || 0) + (dag.vracht.rijtijd || 0);
let totaleArbeid = (dag.bus.arbeid || 0) + (dag.cbr.arbeid || 0) + (dag.vracht.arbeid || 0) + totaleRijtijd;
let totalePauze = (dag.bus.pauze || 0) + (dag.cbr.pauze || 0) + (dag.vracht.pauze || 0);

document.getElementById('lbl-diensturen').innerText = ${dag.start} - ${dag.eind};
document.getElementById('lbl-rijtijd').innerText = formatMinuten(totaleRijtijd);
document.getElementById('lbl-arbeid').innerText = formatMinuten(totaleArbeid);
document.getElementById('lbl-pauze').innerText = formatMinuten(totalePauze);

let restRijDag = Math.max(0, 540 - totaleRijtijd);
document.getElementById('lbl-rest-rijdag').innerText = formatMinuten(restRijDag);

let gisterDate = new Date(datum);
gisterDate.setDate(gisterDate.getDate() - 1);
let gisterStr = gisterDate.toISOString().split('T')[0];

if (logboekData[gisterStr]) {
let eindGister = logboekData[gisterStr].eind;
let startVandaag = dag.start;
document.getElementById('lbl-nachtrust').innerText = berekenRustTussen(eindGister, startVandaag);
} else {
document.getElementById('lbl-nachtrust').innerText = "11:00+ (OK)";
}
}

function formatMinuten(minuten) {
const uren = Math.floor(minuten / 60);
const mins = minuten % 60;
return ${uren.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')};
}

function berekenRustTussen(eind, start) {
const [hEind, mEind] = eind.split(':').map(Number);
const [hStart, mStart] = start.split(':').map(Number);
let rustMinuten = (hStart * 60 + mStart) + (1440 - (hEind * 60 + mEind));
return formatMinuten(rustMinuten);
}

function toonMelding(tekst) {
const box = document.getElementById('wettelijke-melding');
box.innerText = tekst;
box.style.backgroundColor = "rgba(6, 182, 212, 0.1)";
box.style.borderColor = "#06b6d4";
box.style.color = "#06b6d4";
}
</script>

</body>
</html>
